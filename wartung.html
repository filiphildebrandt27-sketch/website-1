<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hildebrandt Objektservice</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1000px 600px at 80% -10%, rgba(79,158,106,.22), transparent 60%), linear-gradient(155deg, #12392b 0%, #16202b 72%);
      color: #eaf1ec;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 32px; text-align: center;
    }
    .card { max-width: 560px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #4f9e6a; box-shadow: 0 0 0 6px rgba(79,158,106,.22); display: inline-block; margin-bottom: 28px; }
    .brand { font-size: 15px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #9ec7ac; margin-bottom: 22px; }
    h1 { font-size: clamp(1.9rem, 5vw, 2.8rem); line-height: 1.15; font-weight: 800; letter-spacing: -.02em; color: #fff; margin-bottom: 18px; }
    p { font-size: 1.1rem; line-height: 1.65; color: #c5d0cb; }
    .rule { width: 54px; height: 3px; background: #4f9e6a; border-radius: 3px; margin: 30px auto 0; }
  </style>
</head>
<body>
  <div class="card">
    <span class="dot" aria-hidden="true"></span>
    <div class="brand">Hildebrandt Objektservice</div>
    <h1>Wir sind bald wieder für Sie da.</h1>
    <p>Unsere Website wird derzeit überarbeitet und ist vorübergehend nicht verfügbar. Bitte schauen Sie in Kürze wieder vorbei.</p>
    <div class="rule" aria-hidden="true"></div>
  </div>
</body>
</html>
